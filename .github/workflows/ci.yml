name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: notes_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d notes_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/notes_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: service/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r service/requirements-dev.txt
      - name: Lint
        run: |
          ruff check service
          ruff format --check service
      - name: Unit and integration tests
        working-directory: service
        run: pytest -q
      - name: Deploy and rollback logic (fake docker compose)
        run: bash scripts/tests/test-deploy-flow.sh

  stack:
    name: Full stack smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Validate the Compose file
        run: docker compose --env-file .env.example config -q
      - name: ShellCheck
        run: shellcheck -x -S warning --source-path=SCRIPTDIR scripts/*.sh scripts/tests/*.sh
      - name: Build the image, bring the stack up and exercise it
        run: ./scripts/smoke-test.sh
