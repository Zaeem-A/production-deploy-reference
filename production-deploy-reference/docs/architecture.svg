<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="t d">
  <title id="t">Architecture of production-deploy-reference</title>
  <desc id="d">Browsers reach Nginx over HTTPS, which proxies to the FastAPI service and PostgreSQL. Prometheus scrapes the API and node-exporter, Grafana queries Prometheus, and backup metrics reach node-exporter through the textfile collector. GitHub Actions builds an image, pushes it to GHCR and runs deploy.sh on the server over SSH.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A1F44"/>
    </marker>
  </defs>

  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif; fill: #1A1F44; }
    .h  { font-size: 14px; font-weight: 700; }
    .s  { font-size: 11.5px; fill: #4A5077; }
    .l  { font-family: ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 11px; fill: #4A5077; }
    .z  { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; }
    .box { fill: #FFFFFF; stroke-width: 1.5; }
    .app { stroke: #2340E0; }
    .ops { stroke: #8A90B0; }
    .ln  { stroke: #1A1F44; stroke-width: 1.5; fill: none; }
  </style>

  <rect width="1200" height="700" fill="#F7F8FB"/>

  <!-- delivery pipeline -->
  <rect class="box ops" x="30"  y="40" width="140" height="70" rx="4"/>
  <text class="h" x="46" y="70">git push / tag</text>
  <text class="s" x="46" y="92">main or v1.2.3</text>

  <rect class="box ops" x="260" y="40" width="260" height="70" rx="4"/>
  <text class="h" x="276" y="70">GitHub Actions</text>
  <text class="s" x="276" y="92">lint, tests, smoke test, build</text>

  <rect class="box ops" x="620" y="40" width="200" height="70" rx="4"/>
  <text class="h" x="636" y="70">GHCR</text>
  <text class="s" x="636" y="92">image sha-1a2b3c4</text>

  <path class="ln" d="M170,75 H258" marker-end="url(#a)"/>
  <path class="ln" d="M520,75 H618" marker-end="url(#a)"/>
  <text class="l" x="569" y="66" text-anchor="middle">push image</text>

  <path class="ln" d="M390,110 V168" marker-end="url(#a)"/>
  <text class="l" x="400" y="144">ssh, deploy.sh</text>
  <path class="ln" d="M720,168 V112" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text class="l" x="730" y="144">docker compose pull</text>

  <!-- server -->
  <rect x="190" y="170" width="980" height="500" rx="8" fill="none" stroke="#8A90B0" stroke-width="1.5"/>
  <text class="z" x="208" y="197">ONE VPS, DOCKER COMPOSE</text>

  <!-- clients -->
  <rect class="box app" x="20" y="250" width="120" height="80" rx="4"/>
  <text class="h" x="36" y="284">Browsers</text>
  <text class="s" x="36" y="306">HTTPS</text>
  <path class="ln" d="M140,290 H228" marker-end="url(#a)"/>
  <text class="l" x="165" y="281" text-anchor="middle">443</text>

  <!-- request path -->
  <rect class="box app" x="230" y="240" width="180" height="100" rx="4"/>
  <text class="h" x="246" y="270">Nginx</text>
  <text class="s" x="246" y="294">TLS, HSTS, rate limit</text>
  <text class="s" x="246" y="314">public ports 80 and 443</text>

  <rect class="box app" x="490" y="240" width="180" height="100" rx="4"/>
  <text class="h" x="506" y="270">FastAPI service</text>
  <text class="s" x="506" y="294">non-root, read-only fs</text>
  <text class="s" x="506" y="314">/healthz /readyz /metrics</text>

  <rect class="box app" x="750" y="240" width="180" height="100" rx="4"/>
  <text class="h" x="766" y="270">PostgreSQL 16</text>
  <text class="s" x="766" y="294">internal network only</text>
  <text class="s" x="766" y="314">volume pgdata</text>

  <path class="ln" d="M410,290 H488" marker-end="url(#a)"/>
  <text class="l" x="449" y="281" text-anchor="middle">proxy</text>
  <path class="ln" d="M670,290 H748" marker-end="url(#a)"/>
  <text class="l" x="709" y="281" text-anchor="middle">SQL</text>

  <!-- backups -->
  <rect class="box ops" x="1000" y="240" width="150" height="100" rx="4"/>
  <text class="h" x="1016" y="270">Backups</text>
  <text class="s" x="1016" y="294">daily dump + sha256</text>
  <text class="s" x="1016" y="314">optional off-site copy</text>
  <path class="ln" d="M930,290 H998" marker-end="url(#a)"/>
  <text class="l" x="964" y="281" text-anchor="middle">pg_dump</text>

  <!-- monitoring -->
  <rect class="box ops" x="230" y="460" width="180" height="100" rx="4"/>
  <text class="h" x="246" y="490">node-exporter</text>
  <text class="s" x="246" y="514">host CPU, memory, disk</text>
  <text class="s" x="246" y="534">textfile collector</text>

  <rect class="box ops" x="490" y="460" width="180" height="100" rx="4"/>
  <text class="h" x="506" y="490">Prometheus</text>
  <text class="s" x="506" y="514">alert rules, 15s scrape</text>
  <text class="s" x="506" y="534">127.0.0.1 only</text>

  <rect class="box ops" x="750" y="460" width="180" height="100" rx="4"/>
  <text class="h" x="766" y="490">Grafana</text>
  <text class="s" x="766" y="514">provisioned dashboard</text>
  <text class="s" x="766" y="534">127.0.0.1 only</text>

  <path class="ln" d="M580,460 V342" marker-end="url(#a)"/>
  <text class="l" x="590" y="404">scrape /metrics</text>
  <path class="ln" d="M490,510 H412" marker-end="url(#a)"/>
  <text class="l" x="451" y="501" text-anchor="middle">scrape</text>
  <path class="ln" d="M750,510 H672" marker-end="url(#a)"/>
  <text class="l" x="711" y="501" text-anchor="middle">query</text>

  <!-- metrics written by the backup, drill and renewal scripts -->
  <path class="ln" d="M1075,340 V620 H320 V562" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text class="l" x="700" y="611" text-anchor="middle">textfile metrics: backup age, restore drill, certificate expiry</text>

  <!-- legend -->
  <rect x="208" y="638" width="18" height="12" fill="#FFFFFF" stroke="#2340E0" stroke-width="1.5"/>
  <text class="s" x="234" y="649">request path</text>
  <rect x="330" y="638" width="18" height="12" fill="#FFFFFF" stroke="#8A90B0" stroke-width="1.5"/>
  <text class="s" x="356" y="649">delivery and operations</text>
</svg>
